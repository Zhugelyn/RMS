services:
  assistant-api:
    build:
      context: ./src/AssistantApi
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Assistant__ServiceKey: ${ASSISTANT__SERVICEKEY}
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  telegram-gateway:
    build:
      context: ./src/TelegramGateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Telegram__BotToken: ${TELEGRAM__BOTTOKEN}
      Telegram__WebhookSecretToken: ${TELEGRAM__WEBHOOKSECRETTOKEN:-}
      Telegram__UsePolling: ${TELEGRAM__USEPOLLING:-true}
      Assistant__BaseUrl: http://assistant-api:8080
      Assistant__ServiceKey: ${ASSISTANT__SERVICEKEY}
    ports:
      - "5081:8080"
    depends_on:
      assistant-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
