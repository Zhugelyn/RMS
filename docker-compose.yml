services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-assistant-dev-password}
    volumes:
      - assistant-pgdata:/var/lib/postgresql/data
    # Internal only — assistant-api owns this DB (database-per-service).
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Phase 7 Knowledge/RAG (ADR-014): Elasticsearch data plane for rag-service.
  # assistant-api must NOT connect here (HTTP to rag-service only — pack retriever).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      cluster.name: telegram-ai-kb
      # phase7-hardening: basic auth on; HTTP SSL off (compose-internal trust).
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH__PASSWORD:-dev-only-elastic-password}
      ES_JAVA_OPTS: ${ELASTICSEARCH__JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    # Internal only — not published; owned by rag-service.
    expose:
      - "9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  rag-service:
    build:
      context: ./src
      dockerfile: RagService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Rag__ServiceKey: ${RAG__SERVICEKEY:-dev-only-rag-service-key}
      Elasticsearch__Uris: http://elasticsearch:9200
      Elasticsearch__Username: elastic
      Elasticsearch__Password: ${ELASTICSEARCH__PASSWORD:-dev-only-elastic-password}
      Elasticsearch__RequestTimeoutSeconds: "10"
    # Internal only — assistant-api calls over compose network (phase7-pack-retriever).
    expose:
      - "8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # Phase 8 Files/MinIO (ADR-015): object store data plane.
  # assistant-api must NOT connect here yet (presign/metadata → phase8-presign).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO__ROOTUSER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO__ROOTPASSWORD:-dev-only-minio-root-password}
    volumes:
      - minio-data:/data
    # Internal only — not published; private buckets via minio-init.
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # One-shot bucket bootstrap: salon ≠ marketing; anonymous=none (private).
  # Not app wiring — no assistant-api / gateway / bridge depends_on or MINIO__* env.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO__ROOTUSER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO__ROOTPASSWORD:-dev-only-minio-root-password}
      MINIO_BUCKET_SALON: ${MINIO__BUCKETSALON:-tg-ai-salon}
      MINIO_BUCKET_MARKETING: ${MINIO__BUCKETMARKETING:-tg-ai-marketing}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_SALON"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_MARKETING"
        mc anonymous set none "local/$$MINIO_BUCKET_SALON"
        mc anonymous set none "local/$$MINIO_BUCKET_MARKETING"
    restart: "on-failure"

  cursor-sdk-bridge:
    build:
      context: ./src
      dockerfile: CursorSdkBridge/Dockerfile
    environment:
      PORT: "8090"
      CURSOR_BRIDGE_MODEL: ${CURSOR__MODEL:-composer-2.5}
      AGENT_PACKS_ROOT: /packs
      RESEARCH_IMAGE_VOLUME: /data/marketing-images
    volumes:
      - research-images:/data/marketing-images
    # Internal only — assistant-api calls this over compose network.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  assistant-api:
    build:
      context: ./src
      dockerfile: AssistantApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Assistant__ServiceKey: ${ASSISTANT__SERVICEKEY}
      ConnectionStrings__AssistantDb: Host=postgres;Port=5432;Database=assistant;Username=assistant;Password=${POSTGRES__PASSWORD:-assistant-dev-password}
      Cursor__BridgeBaseUrl: http://cursor-sdk-bridge:8090
      Cursor__ApiKey: ${CURSOR__APIKEY:-}
      Cursor__EncryptedApiKey: ${CURSOR__ENCRYPTEDAPIKEY:-}
      Cursor__MasterKey: ${CURSOR__MASTERKEY:-}
      Cursor__Model: ${CURSOR__MODEL:-composer-2.5}
      # Phase 4 IG Graph (own account only). Empty → stub skip; compose stays green.
      Instagram__AccessToken: ${INSTAGRAM__ACCESSTOKEN:-}
      Instagram__EncryptedAccessToken: ${INSTAGRAM__ENCRYPTEDACCESSTOKEN:-}
      Instagram__MasterKey: ${INSTAGRAM__MASTERKEY:-}
      Instagram__IgUserId: ${INSTAGRAM__IGUSERID:-}
      Instagram__BusinessAccountId: ${INSTAGRAM__BUSINESSACCOUNTID:-}
      # Phase 6 VK open communities (ADR-013). Empty → stub skip; compose stays green.
      Vk__ServiceToken: ${VK__SERVICETOKEN:-}
      Vk__EncryptedServiceToken: ${VK__ENCRYPTEDSERVICETOKEN:-}
      Vk__MasterKey: ${VK__MASTERKEY:-}
      # ADR-011 GenerateImage volume (Cursor local marketing-pack). Empty Cursor key → skip images.
      Research__ImageVolumePath: ${RESEARCH__IMAGEVOLUMEPATH:-/data/marketing-images}
      Research__ImageCap: "14"
      # Phase 7 Knowledge/RAG (ADR-014). assistant-api → rag-service HTTP only (never ES).
      # Empty BaseUrl → NoOp retriever; chat soft-fails empty hits.
      Rag__BaseUrl: ${RAG__BASEURL:-http://rag-service:8080}
      Rag__ServiceKey: ${RAG__SERVICEKEY:-dev-only-rag-service-key}
      Rag__RequestTimeoutSeconds: "10"
      Rag__TopK: "5"
      # Research notify → gateway /internal/notify (bot token stays in gateway).
      Gateway__BaseUrl: http://telegram-gateway:8080
      Gateway__ServiceKey: ${ASSISTANT__SERVICEKEY}
    volumes:
      - research-images:/data/marketing-images
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      cursor-sdk-bridge:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  telegram-gateway:
    build:
      context: ./src/TelegramGateway
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Telegram__BotToken: ${TELEGRAM__BOTTOKEN}
      Telegram__WebhookSecretToken: ${TELEGRAM__WEBHOOKSECRETTOKEN:-}
      Telegram__UsePolling: ${TELEGRAM__USEPOLLING:-true}
      Telegram__WebAppUrl: ${TELEGRAM__WEBAPPURL:-}
      Assistant__BaseUrl: http://assistant-api:8080
      Assistant__ServiceKey: ${ASSISTANT__SERVICEKEY}
      # Shared volume with assistant-api for research sendPhoto (ADR-011).
      Research__ImageVolumePath: ${RESEARCH__IMAGEVOLUMEPATH:-/data/marketing-images}
      Research__MaxImageBytes: "8388608"
    volumes:
      - research-images:/data/marketing-images:ro
    ports:
      - "5081:8080"
    depends_on:
      assistant-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  assistant-pgdata:
  research-images:
  elasticsearch-data:
  minio-data:
